# One row per thing the driver takes from a document: the section (or the file, for a source), the page, the driver API
# that implements it, and the docs pages that explain it (file names in docs/).
topics:
  - topic: Pre-defined connection set (COB-IDs)
    doc: wiki
    section: "Pre-defined connection set"
    page: 1
    driver: "`kCobId*`, `SdoRequestId()`, `HeartbeatId()`, `EmcyId()`"
    docs: [hardware, architecture, contract]
  - topic: Object dictionary and communication objects
    doc: css
    section: "Object dictionary"
    page: 1
    driver: "`ReadDeviceType()`, `ReadErrorRegister()`, `SdoReadU32()`"
    docs: [api-guide, contract]
  - topic: NMT commands and states
    doc: py-nmt
    section: "NMT commands and state codes"
    page: 1
    driver: "`SendNmt()`, `NmtCommand`, `NmtState`"
    docs: [api-guide, contract, quickstart]
  - topic: NMT master frame (identifier 0, command then node)
    doc: wiki
    section: "Network management (NMT)"
    page: 1
    driver: "`MakeNmtFrame()`, `SendNmt()`"
    docs: [api-guide, contract]
  - topic: SDO expedited and segmented transfer
    doc: py-sdoc
    section: "SdoClient: initiate, upload, download, segments"
    page: 1
    driver: "`SdoUpload()`, `SdoDownload()`, `MakeSdo*()`"
    docs: [api-guide, contract, architecture]
  - topic: SDO command specifiers and abort codes
    doc: py-sdok
    section: "SDO constants"
    page: 1
    driver: "`SdoAbortCode`, `AbortCodeName()`, `ParseSdoReply()`"
    docs: [api-guide, contract, troubleshooting]
  - topic: "SDO server behaviour: toggle bit, size, abort"
    doc: cn-sdo
    section: "CO_SDOserver.h: transfer sequence and abort codes"
    page: 1
    driver: "`GetLastAbort()`, toggle checks, `BufferTooSmall`"
    docs: [contract, troubleshooting, testing, configuration]
  - topic: SDO object access and data types
    doc: py-sdob
    section: "SdoBase: variable access"
    page: 1
    driver: "`SdoReadU8()` to `SdoWriteU32()`"
    docs: [api-guide]
  - topic: Heartbeat consumer
    doc: cn-hb
    section: "CO_HBconsumer.c"
    page: 1
    driver: "`MonitorNode()`, `GetNodeStatus()`, `Poll()`"
    docs: [api-guide, contract, troubleshooting]
  - topic: Node guarding toggle bit
    doc: py-nmt
    section: "NMT guarding reply"
    page: 1
    driver: "`GuardNode()`"
    docs: [api-guide, contract, troubleshooting]
  - topic: Emergency message layout
    doc: cn-emcy
    section: "CO_Emergency.h: EMCY frame"
    page: 1
    driver: "`ParseEmcy()`, `PopEmcy()`, `EmcyEvent`"
    docs: [api-guide, contract]
  - topic: Emergency message consumer
    doc: py-emcy
    section: "EmcyConsumer"
    page: 1
    driver: "`PopEmcy()`"
    docs: [api-guide]
  - topic: SYNC producer and counter
    doc: cn-sync
    section: "CO_SYNC.h: SYNC frame and counter"
    page: 1
    driver: "`SendSync()`, `ConfigureSync()`, `ServiceSync()`"
    docs: [api-guide, contract]
  - topic: Network-level services
    doc: py-net
    section: "Network: send, subscribe"
    page: 1
    driver: "`Client::Poll()`"
    docs: [architecture]
  - topic: PDO communication and mapping parameters
    doc: py-pdo
    section: "PDO map and communication records"
    page: 1
    driver: "`ConfigurePdo()`, `ReadPdoConfig()`, `EncodePdoMapEntry()`"
    docs: [api-guide, contract]
  - topic: Store and restore parameters
    doc: cn-store
    section: "CO_storage.c: signatures and sub-indices"
    page: 1
    driver: "`StoreParameters()`, `RestoreDefaults()`"
    docs: [api-guide, contract]
  - topic: CiA 402 state machine and controlword
    doc: py-402
    section: "BaseNode402: states, masks, transitions"
