# The documents this driver was written against (handbook ADR-0019), and where the driver relies on them.
# Never commit a copy: `sha256` identifies the exact file that was used, so a reader can confirm they hold the same
# revision.
#
# WHAT THE DRIVER FOLLOWS: CANopen's own specifications, CiA 301 (the application layer and communication profile)
# and CiA 402 (the drive profile), are published by CAN in Automation behind a registration or a purchase. They were
# NOT obtained, and no copy was downloaded or requested. The driver's behaviour is taken from the public sources
# below: an encyclopaedia article and a vendor tutorial for the protocol overview, the open-source CANopenNode (C,
# Apache-2.0) and python-canopen (MIT) projects for the byte layouts, the order of operations and the CiA 402 masks,
# and one transceiver datasheet for the physical layer. Where a public source and the specification could differ,
# this driver is conservative (see docs/contract.md, "What is not verified"). What was compared: the SDO abort codes
# against the list in CO_SDOserver.h, the statusword masks and controlwords against the table in p402.py. The
# source files are read, never copied into this repository.
#
# Each file was downloaded once into a scratch folder outside the repository and kept as downloaded; its SHA-256 is
# below. The two web pages were saved as HTML. `pdf` is set only for the transceiver datasheet, which the vendor
# publishes at a stable link; the printed page numbers equal the PDF page numbers (`page_offset: 0`). The source
# files have no pages: `page: 1` stands for "the file". `date` is the revision month the file names, otherwise the
# month it was downloaded. One more file, python-canopen `pdo/map.py`, returned "404: Not Found" and is not listed.
#
# The README card, docs/datasheet.md and the "Datasheet" box on each page are generated from this file by
# tools/docs/generators/datasheet.py (`kokeb-docs gen`).
