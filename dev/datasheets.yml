  - topic: CiA 402 modes of operation
    doc: py-402
    section: "Operation modes"
    page: 1
    driver: "`OperationMode`, `SetDriveMode()`"
    docs: [api-guide]
  - topic: "CAN node: transceiver and controller wiring"
    doc: ti
    section: "11.2 Typical Application"
    page: 26
    driver: "`CanInterface`, `Send()`, `Receive()`"
    docs: [hardware, quickstart, porting]
  - topic: Pin configuration
    doc: ti
    section: "7 Pin Configuration and Functions"
    page: 5
    driver: "`CanInterface`"
    docs: [hardware]
