<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1275" viewBox="0 0 1200 1275" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">The layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: your application calls the Client core, which sends CAN frames through the CAN port contract to the port class you write, which drives the CAN controller; the core and the contract are the same on every MCU.</desc>
