<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">calls</text>
<text x="56" y="853.6" font-size="20" font-weight="700" fill="#F8D27A">Port contract</text>
<text x="56" y="884.2" font-size="17" fill="#D2DAE4">CanInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="1006.6" font-size="20" font-weight="700" fill="#A7F3E6">Your port</text>
<text x="56" y="1035.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Send()  Receive()  NowUs()</text>
<text x="56" y="1158.6" font-size="20" font-weight="700" fill="#E2E8F0">Client</text>
<text x="56" y="1189.2" font-size="17" fill="#D2DAE4">the CAN controller and transceiver, and the nodes on the bus</text>
<rect x="292.3" y="774.6" width="275.3" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="792.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">frames to send, frames received</text>
<rect x="329.6" y="927.6" width="200.8" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="945.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">forwards to your hooks</text>
<rect x="374.7" y="1079.6" width="110.6" height="24" rx="12" fill="#0E131A"/>
<text x="430" y="1097.4" font-size="16" font-weight="500" text-anchor="middle" fill="#9AA6B5">CAN frames</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#F8D27A">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#F8D27A">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#F8D27A">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#F8D27A">and on the host.</text>
<text x="886" y="1006.6" font-size="20" font-weight="700" fill="#A7F3E6">Yours</text>
<text x="886" y="1030.1" font-size="17" fill="#A7F3E6">One small class per MCU or</text>
<text x="886" y="1054.7" font-size="17" fill="#A7F3E6">board.</text>
