<text x="52" y="233.1" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="260.9" font-size="15" class="fk-f-ink2">CAN controller, SN65HVD230 and this driver</text>
<text x="52" y="325.1" font-size="17" font-weight="700" class="fk-f-teal-text">Node</text>
<text x="52" y="352.8" font-size="15" class="fk-f-ink2">node ID 1</text>
<text x="52" y="417.1" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="482.1" font-size="17" font-weight="700" class="fk-f-teal-text">Node</text>
<text x="52" y="509.8" font-size="15" class="fk-f-ink2">node ID up to 127</text>
<text x="515.3" y="186.6" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">CANH</text>
<circle cx="515.3" cy="220.6" r="3.6" class="fk-f-ink2"/>
