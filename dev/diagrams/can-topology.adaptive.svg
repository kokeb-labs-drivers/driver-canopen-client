<rect x="519.3" y="530.6" width="48.5" height="10" rx="2" stroke-width="1.6" class="fk-f-amber-tint fk-s-amber-strong"/>
<text x="608" y="561.8" font-size="14" font-weight="600" text-anchor="end" class="fk-f-amber-text">120 Ω at both ends</text>
<text x="46" y="618.3" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="638.7" font-size="15" class="fk-f-slate-text">Each end of the cable is terminated with 120 Ω, the cable's characteristic</text>
<text x="46" y="660.5" font-size="15" class="fk-f-slate-text">impedance (11.2.1.1, p. 26). Up to 120 SN65HVD23x transceivers on one</text>
<text x="46" y="682.2" font-size="15" class="fk-f-slate-text">bus segment (11.2.1.3, p. 28). ISO 11898: up to 1 Mbit/s, 40 m of bus, 0.3</text>
<text x="46" y="704" font-size="15" class="fk-f-slate-text">m stubs, 30 nodes (11.2.1.3, p. 28). Node IDs 1 to 127, 0 addresses every</text>
<text x="46" y="725.7" font-size="15" class="fk-f-slate-text">node (secondary source) (Communication objects, p. 1).</text>
</svg>
