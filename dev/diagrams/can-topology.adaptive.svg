<svg xmlns="http://www.w3.org/2000/svg" width="640" height="772" viewBox="0 0 640 772" role="img" aria-labelledby="can-topology-title can-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="can-topology-title">CANopen nodes on one CAN bus</title>
<desc id="can-topology-desc">A CAN bus on which the MCU running this driver and the CANopen nodes share the CANH and CANL lines, each node with its own node ID, and a 120 Ω terminating resistor at each end of the pair.</desc>
