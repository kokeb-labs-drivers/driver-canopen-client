<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">CANopen nodes on one CAN bus</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Sources: wiki Communication objects, p. 1; ti 11.2.1.1 CAN Termination, p. 26;</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">ti 11.2.1.3 Bus Loading, Length and Number of Nodes, p. 28.</text>
