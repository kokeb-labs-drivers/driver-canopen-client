<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="588" viewBox="0 0 1272 588" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">SN65HVD230: A CAN node</title>
<desc id="chip-circuit-typical-desc">Schematic of the SN65HVD230 a can node: the chip with U2 MCU with CAN controller, C1 capacitor 100 nF, R1 resistor 120 Ω, J1 CAN bus; the MCU wires carry the port hooks Receive(CanFrame&amp;, timeout_us), Send(const CanFrame&amp;).</desc>
<rect x="0.5" y="0.5" width="1271" height="587" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">SN65HVD230: A CAN node</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The transceiver between the MCU's CAN controller (TX and RX) and the bus, RS tied to ground for high speed, the bus terminated with 120 Ω at its ends (the</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">resistor is fitted only on the two end nodes). Above each MCU wire: the port hook that drives it. Datasheet: 11.2 Typical Application, p. 26.</text>
