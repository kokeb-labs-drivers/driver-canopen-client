<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1134" viewBox="0 0 640 1134" role="img" aria-labelledby="can-timing-title can-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="can-timing-title">One dominant bit through the transceiver</title>
<desc id="can-timing-desc">CAN timing through the SN65HVD230: the controller pulls D low, the transceiver drives the bus dominant with CANH high and CANL low, and R follows after the loop delay, with the voltages and delays of the datasheet.</desc>
