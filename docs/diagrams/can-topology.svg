<svg xmlns="http://www.w3.org/2000/svg" width="640" height="772" viewBox="0 0 640 772" role="img" aria-labelledby="can-topology-title can-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="can-topology-title">CANopen nodes on one CAN bus</title>
<desc id="can-topology-desc">A CAN bus on which the MCU running this driver and the CANopen nodes share the CANH and CANL lines, each node with its own node ID, and a 120 Ω terminating resistor at each end of the pair.</desc>
<rect x="0.5" y="0.5" width="639" height="771" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#7A360E">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#0E1726">CANopen nodes on one CAN bus</text>
<text x="32" y="102.7" font-size="15" fill="#566070">Sources: wiki Communication objects, p. 1; ti 11.2.1.1 CAN Termination, p. 26;</text>
<text x="32" y="124.5" font-size="15" fill="#566070">ti 11.2.1.3 Bus Loading, Length and Number of Nodes, p. 28.</text>
<rect x="32" y="140.4" width="576" height="1" fill="#E2E7EE"/>
