<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">SN65HVD230</title>
<desc id="chip-hero-desc">Overview of the SN65HVD230, a 3.3 V CAN transceiver, the reference physical layer of a CANopen node: it turns a CAN controller's TXD and RXD into the differential CANH and CANL signals of an ISO 11898-2 bus, and this driver speaks CANopen to the nodes on that bus. A MCU talks to it over CAN controller TXD and RXD; it drives CAN bus pair; it reads back Bus level. Headline figures: 3.0 to 3.6 V single supply; 1 Mbit/s data rate, up to; 120 nodes on one bus; 16 kV bus pin ESD, HBM; 370 µA standby current, typical.</desc>
