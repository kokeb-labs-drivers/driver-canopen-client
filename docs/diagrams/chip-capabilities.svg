<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1002" viewBox="0 0 1200 1002" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the SN65HVD230 does</title>
<desc id="chip-capabilities-desc">Capability map of the SN65HVD230: Start and stop nodes (supported): Sends the NMT commands that start, stop, pre-operate and reset one node or all of them; Read and write objects (supported): Reads and writes object dictionary entries, in one frame or in segments, with the node's abort code; Heartbeat, guarding and emergencies (supported): Watches node heartbeats and guarding replies, and queues the emergency messages nodes send; SYNC producer (supported): Sends the SYNC frame, once or on a period with the optional counter byte; Process data (supported): Maps and enables a node's PDOs in the order the profile asks, reads TPDO samples and sends RPDOs; CiA 402 drive control (supported): Reads the drive state and walks it to enabled, disabled, quick stop or fault reset, and sets the mode; Node identity and settings (supported): Reads a node's device type and error register, sets its heartbeat time, stores or restores its parameters; Raw frames (supported): Sends and reads any classic CAN frame and returns the raw reply of an SDO request; Block transfer, FD and LSS (not covered): Block transfer, CAN FD, 29-bit identifiers, LSS, an NMT slave and an SDO server are not implemented.</desc>
